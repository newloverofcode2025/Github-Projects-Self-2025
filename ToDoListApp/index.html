<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> <!-- Compatibility for older browsers -->
    <title>Halo - Your Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/favicon.png"> <!-- Add a favicon -->
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-halo"></i> Halo - Your Assistant</h1>

        <!-- Dark Mode Toggle -->
        <div class="dark-mode-toggle">
            <label for="darkModeToggle"><i class="fas fa-moon"></i> Dark Mode</label>
            <input type="checkbox" id="darkModeToggle">
        </div>

        <!-- User Authentication -->
        <div class="auth-section">
            <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
            <button id="signupBtn"><i class="fas fa-user-plus"></i> Sign Up</button>
            <button id="logoutBtn" style="display: none;"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <!-- Input Section -->
        <div class="input-container">
            <label for="taskInput" class="sr-only">Task Description</label>
            <input type="text" id="taskInput" placeholder="Enter a new task..." required aria-label="Task Description">

            <label for="dueDateInput" class="sr-only">Due Date</label>
            <input type="date" id="dueDateInput" required aria-label="Due Date">

            <label for="priorityInput" class="sr-only">Priority Level</label>
            <select id="priorityInput" aria-label="Priority Level">
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>

            <label for="categoryInput" class="sr-only">Category</label>
            <select id="categoryInput" aria-label="Category">
                <option value="personal">🏠 Personal</option>
                <option value="work">💼 Work</option>
                <option value="shopping">🛒 Shopping</option>
            </select>

            <button id="addTaskBtn"><i class="fas fa-plus"></i> Add Task</button>
        </div>

        <!-- Search and Filters -->
        <div class="filters">
            <label for="searchInput" class="sr-only">Search Tasks</label>
            <input type="text" id="searchInput" placeholder="🔍 Search tasks..." aria-label="Search Tasks">

            <label for="filterPriority" class="sr-only">Filter by Priority</label>
            <select id="filterPriority" aria-label="Filter by Priority">
                <option value="all">All Priorities</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>

            <label for="filterStatus" class="sr-only">Filter by Status</label>
            <select id="filterStatus" aria-label="Filter by Status">
                <option value="all">All Statuses</option>
                <option value="completed">✅ Completed</option>
                <option value="pending">⏳ Pending</option>
            </select>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Progress Tracker -->
        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>

        <!-- Export/Import Buttons -->
        <div class="export-import">
            <button id="exportTasksBtn"><i class="fas fa-download"></i> Export Tasks</button>
            <button id="importTasksBtn"><i class="fas fa-upload"></i> Import Tasks</button>
        </div>

        <!-- Notification Permission Button -->
        <button id="enableNotificationsBtn"><i class="fas fa-bell"></i> Enable Notifications</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
